name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --python '${{ matrix.python }}'
      - run: uv run pytest
      - run: uv build
      - name: Test installed wheel
        shell: bash
        run: |
          uv venv /tmp/enronqa-wheel --python '${{ matrix.python }}'
          uv pip install --python /tmp/enronqa-wheel/bin/python dist/*.whl
          /tmp/enronqa-wheel/bin/enronqa --help
          /tmp/enronqa-wheel/bin/enronqa instructions
  homebrew:
    # The standalone bundle the release ships, installed through the Homebrew
    # cask that scripts/publish-packages.sh writes, from a local tap.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the bundle
        run: |
          uv sync --locked --no-dev --group release --no-editable --managed-python --python cpython-3.12-macos-aarch64-none
          uv run --no-sync pyinstaller --noconfirm --clean packaging/enronqa.spec
          cp LICENSE dist/enronqa/LICENSE
      - name: Install and test the cask
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/enronqa/__init__.py)"
          mkdir -p "$RUNNER_TEMP/assets"
          tar -C dist -czf "$RUNNER_TEMP/assets/enronqa-cli_${version}_darwin_arm64.tar.gz" enronqa
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 -- * > SHA256SUMS
          # Only the arm64 macOS bundle is built here; the other targets get placeholder sums.
          for t in darwin_amd64 linux_amd64 linux_arm64; do
            echo "$(printf '0%.0s' {1..64})  enronqa-cli_${version}_${t}.tar.gz" >> SHA256SUMS
          done
          brew tap-new --no-git dorkitude/enronqa-ci
          cask_dir="$(brew --repository)/Library/Taps/dorkitude/homebrew-enronqa-ci/Casks"
          mkdir -p "$cask_dir"
          CHECKSUMS=SHA256SUMS URL_BASE="file://$RUNNER_TEMP/assets" CASK_ONLY=1 \
            "$GITHUB_WORKSPACE/scripts/publish-packages.sh" "v$version" > "$cask_dir/enronqa-cli.rb"
          cat "$cask_dir/enronqa-cli.rb"
          brew install --cask dorkitude/enronqa-ci/enronqa-cli
          mkdir "$RUNNER_TEMP/cwd" && cd "$RUNNER_TEMP/cwd"
          test "$(enronqa --version)" = "$version"
          enronqa --help | grep -q fetch
          enronqa instructions | grep -q 'nonblank string answer'
          test -z "$(ls -A)"
